version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubeshark/demo-apps
