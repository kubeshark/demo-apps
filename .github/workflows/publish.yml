name: Publish

# Images and uniquely versioned dev charts are pushed on every branch push.
# v* tags retain stable chart versions and image tags. Skipped until the
# repository variable AWS_ROLE_ARN (terraform output role_arn) is set.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY || 'public.ecr.aws/l3y1d4r0' }}

jobs:
  images:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      chart-version: ${{ steps.tag.outputs.chart-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.9
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - name: Tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "chart-version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
            branch=${branch:0:100}
            branch=${branch#-}
            branch=${branch%-}
            branch=${branch:-dev}
            if [[ "$branch" =~ ^[0-9]+$ ]]; then branch="branch-$branch"; fi
            echo "tag=$branch-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "chart-version=0.2.1-$branch.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Go images
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/kubeshark/demo-apps
          TAG: ${{ steps.tag.outputs.tag }}
        run: make images TAG="$TAG"
      - name: Client images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          make client-images REGISTRY="$REGISTRY/kubeshark/demo-apps" TAG="$TAG"
          for c in java python node; do docker push "$REGISTRY/kubeshark/demo-apps/client-$c:$TAG"; done

  chart:
    if: vars.AWS_ROLE_ARN != ''
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Package and push
        env:
          VERSION: ${{ needs.images.outputs.chart-version }}
          IMAGE_TAG: ${{ needs.images.outputs.image-tag }}
        run: |
          aws ecr-public get-login-password | helm registry login --username AWS --password-stdin public.ecr.aws
          helm package deploy/chart --version "$VERSION" --app-version "$IMAGE_TAG"
          helm push "demo-apps-$VERSION.tgz" "oci://$REGISTRY/kubeshark/charts"
