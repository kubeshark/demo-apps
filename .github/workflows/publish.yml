name: Publish

# Images and uniquely versioned dev charts are pushed on every branch push.
# v* tags retain stable chart versions and image tags. Skipped until the
# repository variable AWS_ROLE_ARN (terraform output role_arn) is set.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      chart_only:
        description: Run wallet-capture checks and publish only a development chart with v0.3.0 images
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY || 'public.ecr.aws/l3y1d4r0' }}

jobs:
  images:
    if: vars.AWS_ROLE_ARN != '' && !inputs.chart_only
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      chart-version: ${{ steps.tag.outputs.chart-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.9
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - name: Tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "chart-version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
            branch=${branch:0:100}
            branch=${branch#-}
            branch=${branch%-}
            branch=${branch:-dev}
            if [[ "$branch" =~ ^[0-9]+$ ]]; then branch="branch-$branch"; fi
            echo "tag=$branch-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "chart-version=0.3.1-$branch.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Go images
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/kubeshark/demo-apps
          TAG: ${{ steps.tag.outputs.tag }}
        run: make images TAG="$TAG"
      - name: Client images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          make client-images REGISTRY="$REGISTRY/kubeshark/demo-apps" TAG="$TAG"
          for c in java python node; do docker push "$REGISTRY/kubeshark/demo-apps/client-$c:$TAG"; done

  chart:
    if: vars.AWS_ROLE_ARN != ''
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Package and push
        env:
          VERSION: ${{ needs.images.outputs.chart-version }}
          IMAGE_TAG: ${{ needs.images.outputs.image-tag }}
        run: |
          aws ecr-public get-login-password | helm registry login --username AWS --password-stdin public.ecr.aws
          helm package deploy/chart --version "$VERSION" --app-version "$IMAGE_TAG"
          helm push "demo-apps-$VERSION.tgz" "oci://$REGISTRY/kubeshark/charts"

  chart-only:
    if: github.event_name == 'workflow_dispatch' && inputs.chart_only && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Validate controlled capture fixture
        run: |
          test "$GITHUB_REF_TYPE" = branch
          go test ./hack/chartcontract -run '^(TestWalletCaptureFixture|TestPackagedWorkloadContract)$' -count=1 -timeout=90s
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Package and push development chart only
        run: |
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
          branch=${branch:0:100}
          branch=${branch#-}
          branch=${branch%-}
          branch=${branch:-dev}
          if [[ "$branch" =~ ^[0-9]+$ ]]; then branch="branch-$branch"; fi
          version="0.3.1-$branch.g${GITHUB_SHA::7}"
          helm package deploy/chart --version "$version" --app-version v0.3.0
          sha256sum "demo-apps-$version.tgz" > "demo-apps-$version.tgz.sha256"
          aws ecr-public get-login-password | helm registry login --username AWS --password-stdin public.ecr.aws
          helm push "demo-apps-$version.tgz" "oci://$REGISTRY/kubeshark/charts"
          printf 'Chart version: `%s`\n\nApplication images: `v0.3.0`\n\n' "$version" >> "$GITHUB_STEP_SUMMARY"
          cat "demo-apps-$version.tgz.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-capture-chart
          path: |
            demo-apps-*.tgz
            demo-apps-*.tgz.sha256
