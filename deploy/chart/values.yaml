global:
  # Images built in this repository resolve as <registry>/<imagePrefix>/<service>:<imageTag>.
  # Third-party servers resolve as <registry>/<mirrorPrefix>/<name>:<tag>, copied by digest
  # from mirrors.yaml at the repository root.
  registry: public.ecr.aws/l3y1d4r0
  imagePrefix: kubeshark/demo-apps
  # Empty means the same registry as above. Set both to pull servers from their upstream
  # registry instead of the mirror, e.g. mirrorRegistry: docker.io, mirrorPrefix: library.
  mirrorRegistry: ""
  mirrorPrefix: kubeshark/mirror
  # Empty means the chart's appVersion.
  imageTag: ""
  imagePullPolicy: IfNotPresent

# A flow is one narratable path. Enabling it renders the services and servers it needs.
flows:
  catalog:
    enabled: true
    interval: 10s
  inventory:
    enabled: true
    interval: 10s
  # gateway -> orders (http) -> postgresql -> kafka -> notifier -> rabbitmq (amqp)
  orders:
    enabled: true
    interval: 10s
    # Pins the Kafka client's API versions to what the dissector decodes. Off lets the
    # client negotiate the newest versions the broker offers, which the dissector may
    # not decode yet; that scenario exists to make the gap visible.
    kafkaPinned: true
  # gateway -> graphql (http POST application/json) -> postgresql
  graphql:
    enabled: true
    interval: 10s
  # gateway -> live (websocket session with server pushes)
  websocket:
    enabled: true
    interval: 10s
  # gateway -> identity (http) -> ldap bind + search, radius access + accounting
  identity:
    enabled: true
    interval: 10s
  # gateway -> telco (http) -> diameter over tcp and over sctp, plain sctp echo
  telco:
    enabled: true
    interval: 10s
  # gateway -> netprobe (http) -> dns lookups, icmp ping, https egress
  netprobe:
    enabled: true
    interval: 10s
    # External HTTPS endpoints the egress step calls; empty disables egress and external DNS.
    egressURLs:
      - https://www.example.com
      - https://www.cloudflare.com/cdn-cgi/trace
  # gateway -> ledger (http) -> mssql. Off by default: no TDS dissector exists yet, so this
  # traffic shows as tcp, and the server needs 2 GiB.
  ledger:
    enabled: false
    interval: 10s

# Drives every enabled flow on its interval through the gateway, the same way a UI click does.
runner:
  enabled: true
  errorEvery: 10
  slowEvery: 20
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}

gateway:
  resources:
    requests: {cpu: 50m, memory: 16Mi}
    limits: {cpu: 250m, memory: 64Mi}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    host: demo-apps.example.com
    annotations: {}
    tls: []
  # When set, the runner sends every second run to this URL instead of the in-cluster
  # service, so ingress-ingested traffic appears alongside the direct path.
  externalURL: ""

# TLS for the gateway (HTTPS on 8443), the inventory gRPC API (9443) and postgresql. The chart
# generates a CA and a server certificate once and keeps them across upgrades. Set
# existingSecret to a Secret with ca.crt, tls.crt and tls.key (for example one issued by
# cert-manager) to use your own.
tls:
  enabled: true
  existingSecret: ""

# Periodic clients in other languages, so TLS from the JVM, OpenSSL (Python) and Node
# runtimes appears next to Go's. Each calls a flow through the gateway over HTTPS and talks
# to one server over TLS. Requires tls.enabled.
clients:
  interval: 15s
  java:
    # JDK HttpClient to the gateway, pgjdbc to postgresql with sslmode=verify-full.
    enabled: true
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 500m, memory: 192Mi}
  python:
    # requests to the gateway, psycopg 3 to postgresql with sslmode=verify-full.
    enabled: true
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 200m, memory: 96Mi}
  node:
    # fetch to the gateway, @grpc/grpc-js to the inventory TLS listener.
    enabled: true
    resources:
      requests: {cpu: 20m, memory: 48Mi}
      limits: {cpu: 200m, memory: 128Mi}

services:
  catalog:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  inventory:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  orders:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  notifier:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  graphql:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  live:
    resources:
      requests: {cpu: 20m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  identity:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  telco:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}
  # The Diameter server and SCTP echo the telco flow talks to, built here.
  telcoServer:
    resources:
      requests: {cpu: 20m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  netprobe:
    resources:
      requests: {cpu: 20m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  ledger:
    resources:
      requests: {cpu: 50m, memory: 16Mi}
      limits: {cpu: 250m, memory: 64Mi}

# Every server requires authentication. Credentials are demo defaults rendered into
# Secrets; set existingSecret to supply your own with the same keys.
servers:
  redis:
    image: {name: redis, tag: 7.4.11, digest: "sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b"}
    password: demo-redis-password
    existingSecret: ""
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
  mysql:
    image: {name: mysql, tag: 8.4.13, digest: "sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69"}
    database: catalog
    user: catalog
    password: demo-mysql-password
    rootPassword: demo-mysql-root-password
    existingSecret: ""
    # performance_schema off and a 64M buffer pool keep an idle server near 250 MiB.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  mongodb:
    # 8.x refuses to start on Linux 6.19 through 7.0.13 (vendored tcmalloc); 7.0 runs everywhere.
    image: {name: mongo, tag: 7.0.45, digest: "sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7"}
    rootUser: root
    rootPassword: demo-mongodb-password
    existingSecret: ""
    # The WiredTiger cache is capped at 0.25 GB in the template.
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 384Mi}
  postgresql:
    image: {name: postgres, tag: "17.11", digest: "sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe"}
    database: demo
    user: demo
    password: demo-postgresql-password
    existingSecret: ""
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  kafka:
    # KRaft single node, native (GraalVM) build. SASL/PLAIN on the SASL_PLAINTEXT listener;
    # the native image supports SASL from 4.4.0.
    image: {name: kafka-native, tag: 4.4.0, digest: "sha256:11fde816adf384402de9f3e57aeaf2c3722ba0671610247817688d07441714b4"}
    user: demo
    password: demo-kafka-password
    existingSecret: ""
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 384Mi}
  rabbitmq:
    image: {name: rabbitmq, tag: 4.3.7-alpine, digest: "sha256:f843f29765b9bf9303ac8af0f33de3bc650ee00bf5a9c0056dfd479f75bce588"}
    user: demo
    password: demo-rabbitmq-password
    existingSecret: ""
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 500m, memory: 256Mi}
  openldap:
    image: {name: openldap, tag: 1.5.0, digest: "sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28"}
    domain: demo.local
    adminPassword: demo-ldap-admin-password
    existingSecret: ""
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
  freeradius:
    image: {name: freeradius-server, tag: 3.2.10-alpine, digest: "sha256:91acbee4a1f532e3a266ae3d7f153a5cf21f5faa9bc14116d5d1fe2c2a746c27"}
    secret: demo-radius-shared-secret
    existingSecret: ""
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
  coredns:
    image: {name: coredns, tag: 1.14.7, digest: "sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286"}
    zone: demo.local
    resources:
      requests: {cpu: 20m, memory: 16Mi}
      limits: {cpu: 200m, memory: 64Mi}
  mssql:
    image: {name: mssql-server, tag: 2022-CU27-ubuntu-22.04, digest: "sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090"}
    saPassword: Demo-mssql-password-1
    existingSecret: ""
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: 1000m, memory: 2Gi}
