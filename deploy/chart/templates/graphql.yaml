{{- if include "demo-apps.need" (merge (dict "component" "graphql") .) }}
{{- $ctx := dict "root" . "name" "graphql" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-graphql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: graphql
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_ADDR
              value: {{ .Release.Name }}-postgresql:5432
            - name: POSTGRES_DATABASE
              value: {{ .Values.servers.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.servers.postgresql.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-apps.secretName" (dict "root" . "name" "postgresql" "server" .Values.servers.postgresql) }}
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.services.graphql.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-graphql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
