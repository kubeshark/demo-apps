{{- if include "demo-apps.anyFlow" . }}
{{- $ctx := dict "root" . "name" "gateway" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            {{- if .Values.flows.catalog.enabled }}
            - name: CATALOG_URL
              value: http://{{ .Release.Name }}-catalog:8080
            {{- end }}
            {{- if .Values.flows.inventory.enabled }}
            - name: INVENTORY_ADDR
              value: {{ .Release.Name }}-inventory:9090
            {{- end }}
            {{- if .Values.flows.orders.enabled }}
            - name: ORDERS_URL
              value: http://{{ .Release.Name }}-orders:8080
            {{- end }}
            {{- if .Values.flows.graphql.enabled }}
            - name: GRAPHQL_URL
              value: http://{{ .Release.Name }}-graphql:8080
            {{- end }}
            {{- if .Values.flows.websocket.enabled }}
            - name: LIVE_URL
              value: ws://{{ .Release.Name }}-live:8080
            {{- end }}
            {{- if .Values.flows.identity.enabled }}
            - name: IDENTITY_URL
              value: http://{{ .Release.Name }}-identity:8080
            {{- end }}
            {{- if .Values.flows.telco.enabled }}
            - name: TELCO_URL
              value: http://{{ .Release.Name }}-telco:8080
            {{- end }}
            {{- if .Values.flows.netprobe.enabled }}
            - name: NETPROBE_URL
              value: http://{{ .Release.Name }}-netprobe:8080
            {{- end }}
            {{- if .Values.flows.ledger.enabled }}
            - name: LEDGER_URL
              value: http://{{ .Release.Name }}-ledger:8080
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_FILE
              value: /etc/demo-apps/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/demo-apps/tls/tls.key
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: 8443
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/demo-apps/tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "demo-apps.tlsSecret" . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
    {{- if .Values.tls.enabled }}
    - name: https
      port: 443
      targetPort: https
    {{- end }}
{{- if .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.gateway.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  name: http
{{- end }}
{{- end }}
