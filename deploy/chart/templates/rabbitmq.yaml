{{- if include "demo-apps.need" (merge (dict "component" "rabbitmq") .) }}
{{- $ctx := dict "root" . "name" "rabbitmq" }}
{{- $s := .Values.servers.rabbitmq }}
{{- $secret := include "demo-apps.secretName" (dict "root" . "name" "rabbitmq" "server" $s) }}
{{- if not $s.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
stringData:
  password: {{ $s.password | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ include "demo-apps.mirrorImage" (dict "root" . "image" $s.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ $s.user }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: password}
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
          ports:
            - name: amqp
              containerPort: 5672
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rabbitmq
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
{{- end }}
