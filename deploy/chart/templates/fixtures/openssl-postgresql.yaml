apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  name: postgres-tls-config
data:
  pg_hba.conf: |
    # Force TLS for all remote connections. Local socket is left as trust so
    # health probes keep working without sticking creds in the manifest.
    local all all                trust
    host  all all 127.0.0.1/32   trust
    hostssl all all 0.0.0.0/0    md5
    hostssl all all ::/0         md5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: postgres
  labels: { app: postgres, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # fsGroup=999 = postgres group; lets the postgres user read the mounted TLS key
      # (postgres requires ssl_key_file to be mode 0600 or 0640 with group ownership).
      securityContext:
        fsGroup: 999
      # Init container copies the TLS material to a postgres-owned emptyDir with 0600
      # perms - postgres refuses to start with any group/world permissions on ssl_key_file.
      initContainers:
      - name: prep-tls
        image: docker.io/postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        command:
        - /bin/sh
        - -c
        - |
          cp /src/server.crt /dst/server.crt
          cp /src/server.key /dst/server.key
          chmod 0600 /dst/server.crt /dst/server.key
          chown 999:999 /dst/server.crt /dst/server.key
        volumeMounts:
        - name: tls-src
          mountPath: /src
          readOnly: true
        - name: tls-runtime
          mountPath: /dst
      containers:
      - name: postgres
        image: docker.io/postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        args:
          - "-c"
          - "ssl=on"
          - "-c"
          - "ssl_cert_file=/etc/postgres-tls/server.crt"
          - "-c"
          - "ssl_key_file=/etc/postgres-tls/server.key"
          - "-c"
          - "hba_file=/etc/postgres-config/pg_hba.conf"
        env:
        - name: POSTGRES_PASSWORD
          value: "test"
        - name: POSTGRES_DB
          value: "testdb"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: tls-runtime
          mountPath: /etc/postgres-tls
          readOnly: true
        - name: pg-config
          mountPath: /etc/postgres-config
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: tls-src
        secret:
          secretName: postgres-tls
      - name: tls-runtime
        emptyDir: {}
      - name: pg-config
        configMap:
          name: postgres-tls-config
      - name: data
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  name: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  name: postgres-traffic-script
data:
  send.sh: |
    #!/bin/sh
    set -e
    : "${MARKER_PREFIX:?missing}"
    : "${EXPECTED_MARKERS:?missing}"
    export PGPASSWORD="test"
    export PGSSLMODE="require"

    until psql -h postgres -U postgres -d testdb -c "SELECT 1" >/dev/null 2>&1; do
      echo "waiting for postgres tls..."
      sleep 2
    done

    psql -h postgres -U postgres -d testdb -c \
      "CREATE TABLE IF NOT EXISTS tls_test (id SERIAL PRIMARY KEY, marker TEXT)"

    # Compose a per-iteration query containing every expected marker. Loop forever
    # so the verifier doesn't race with a single one-shot insertion.
    Q=""
    i=1
    while [ "$i" -le "$EXPECTED_MARKERS" ]; do
      Q="${Q}INSERT INTO tls_test (marker) VALUES ('${MARKER_PREFIX}_seq${i}');"
      i=$((i + 1))
    done
    Q="${Q}DELETE FROM tls_test;"

    echo "Sending markers: ${MARKER_PREFIX}_seq1..${EXPECTED_MARKERS} (loop)"
    while true; do
      psql -h postgres -U postgres -d testdb -c "$Q" || echo "send failed, retrying"
      sleep {{ include "demo-apps.fixtureSeconds" . }}
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: postgres-traffic-generator
  labels: { app: postgres-traffic-generator, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-traffic-generator }
  template:
    metadata:
      labels: { app: postgres-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        command: ["/bin/sh", "/scripts/send.sh"]
        env:
        - name: MARKER_PREFIX
          value: {{ .Values.fixture.markerPrefix | quote }}
        - name: EXPECTED_MARKERS
          value: {{ .Values.fixture.markerCount | quote }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: postgres-traffic-script
          defaultMode: 0755
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
