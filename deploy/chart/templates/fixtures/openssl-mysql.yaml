apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mysql
  labels: { app: mysql, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      # fsGroup=999 = mysql group; lets the mysql user read the mounted TLS key.
      securityContext:
        fsGroup: 999
      containers:
      - name: mysql
        image: docker.io/mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        args:
          - "--ssl-cert=/etc/mysql-tls/server.crt"
          - "--ssl-key=/etc/mysql-tls/server.key"
          - "--require-secure-transport=ON"
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "test"
        - name: MYSQL_DATABASE
          value: "testdb"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: tls
          mountPath: /etc/mysql-tls
          readOnly: true
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: tls
        secret:
          secretName: mysql-tls
          defaultMode: 0640
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  name: mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  name: mysql-traffic-script
data:
  send.sh: |
    #!/bin/sh
    set -e
    : "${MARKER_PREFIX:?missing}"
    : "${EXPECTED_MARKERS:?missing}"

    # Wait until mysqld accepts TLS connections.
    until mysql --host=mysql --user=root --password=test --ssl-mode=REQUIRED \
        -e "SELECT 1" testdb >/dev/null 2>&1; do
      echo "waiting for mysql tls..."
      sleep 2
    done

    mysql --host=mysql --user=root --password=test --ssl-mode=REQUIRED testdb \
      -e "CREATE TABLE IF NOT EXISTS tls_test (id INT AUTO_INCREMENT PRIMARY KEY, marker VARCHAR(255))"

    # Compose the per-iteration query containing every expected marker. The verifier
    # only needs each marker to appear inside one captured query body - looping
    # makes that resilient to the verifier connecting after the first iteration.
    Q=""
    i=1
    while [ "$i" -le "$EXPECTED_MARKERS" ]; do
      Q="${Q}INSERT INTO tls_test (marker) VALUES ('${MARKER_PREFIX}_seq${i}');"
      i=$((i + 1))
    done
    Q="${Q}DELETE FROM tls_test;"

    echo "Sending markers: ${MARKER_PREFIX}_seq1..${EXPECTED_MARKERS} (loop)"
    while true; do
      mysql --host=mysql --user=root --password=test --ssl-mode=REQUIRED testdb \
        -e "$Q" || echo "send failed, retrying"
      sleep {{ include "demo-apps.fixtureSeconds" . }}
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mysql-traffic-generator
  labels: { app: mysql-traffic-generator, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql-traffic-generator }
  template:
    metadata:
      labels: { app: mysql-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        command: ["/bin/sh", "/scripts/send.sh"]
        env:
        - name: MARKER_PREFIX
          value: {{ .Values.fixture.markerPrefix | quote }}
        - name: EXPECTED_MARKERS
          value: {{ .Values.fixture.markerCount | quote }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mysql-traffic-script
          defaultMode: 0755
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
