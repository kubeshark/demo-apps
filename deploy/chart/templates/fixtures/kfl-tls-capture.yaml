{{- if eq .Values.fixture.name "kfl-tls-capture" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: outbound-tls-readiness-script
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
data:
  ready.py: |
    {{- .Files.Get "files/clients/outbound-tls-ready.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
    app: mizutest-outbound-tls-openssl
    name: mizutest-outbound-tls-openssl
    version: v0.1.0
  name: mizutest-outbound-tls-openssl
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mizutest-outbound-tls-openssl
  template:
    metadata:
      labels:
        app: mizutest-outbound-tls-openssl
        name: mizutest-outbound-tls-openssl
        version: v0.1.0
    spec:
      containers:
      - command:
        - python3
        - /scripts/ready.py
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONIOENCODING
          value: UTF-8
        image: 851725373216.dkr.ecr.us-east-1.amazonaws.com/mertyildiran/mizutest-outbound-tls-openssl:latest@sha256:8e56bcce5123ee017977a4b66619a021b2a20b559e8b5cfb5c647f7e6cb9e724
        imagePullPolicy: Always
        name: mizutest-outbound-tls-openssl
        {{- include "demo-apps.trafficReadiness" . | nindent 8 }}
        volumeMounts:
        - {name: readiness-script, mountPath: /scripts, readOnly: true}
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 50m
            memory: 200Mi
          requests:
            cpu: 10m
            memory: 10Mi
      volumes:
      - name: readiness-script
        configMap:
          name: outbound-tls-readiness-script
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}