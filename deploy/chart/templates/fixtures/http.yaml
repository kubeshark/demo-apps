{{- if has .Values.fixture.name (list "http" "http-redis" "http-redis-kafka") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  name: curl-client
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: curl-client
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: curl-client
    spec:
      containers:
      - image: 851725373216.dkr.ecr.us-east-1.amazonaws.com/alpine/curl:8.9.1@sha256:e13f4217ebcbb8dbbfad0ae422bca76a3b037b0030cb7123138b4cb1ca49fbb5
        imagePullPolicy: Always
        name: curl-client
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://http-server 2>&1;
            sleep 1;
          done
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  name: http-server
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: http-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: http-server
    spec:
      containers:
      - image: 851725373216.dkr.ecr.us-east-1.amazonaws.com/nginxinc/nginx-unprivileged:1.27@sha256:ad235e7dc37fe96da6374367277329936cb928b2e5c1d39f81d4331e49b5266e
        imagePullPolicy: Always
        name: http-server
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  name: http-server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: http-server
  sessionAffinity: None
  type: ClusterIP
{{- end }}
