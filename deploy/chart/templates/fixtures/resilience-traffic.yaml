{{- if has .Values.fixture.name (list "resilience-traffic") }}
---
# Traffic whose markers strictly increase, so a test can prove that what it saw
# after a fault is new traffic rather than a late-delivered entry from before it.
#
# The looping generators used elsewhere cycle a fixed set of marker IDs, which
# cannot distinguish "capture resumed" from "a pre-fault entry arrived late".
# Here the counter never repeats: an entry carrying a sequence higher than the
# highest seen before the fault can only have been captured after it.
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  labels:
    demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }}
  name: resilience-server
spec:
  selector:
    app: resilience-server
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: resilience-server
  labels: { app: resilience-server, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: resilience-server }
  template:
    metadata:
      labels: { app: resilience-server }
    spec:
      containers:
      - name: server
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        image: 851725373216.dkr.ecr.us-east-1.amazonaws.com/nginxinc/nginx-unprivileged:1.27@sha256:ad235e7dc37fe96da6374367277329936cb928b2e5c1d39f81d4331e49b5266e
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: resilience-generator
  labels: { app: resilience-generator, demo-apps.kubeshark.co/fixture: {{ .Values.fixture.name | quote }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: resilience-generator }
  template:
    metadata:
      labels: { app: resilience-generator }
    spec:
      # Client and server are pinned together so the flow is captured by exactly
      # one worker. The fault cases kill the worker on this node, and a flow
      # split across two nodes would be observable through the surviving one.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: resilience-server }
            topologyKey: kubernetes.io/hostname
      containers:
      - name: client
        image: 851725373216.dkr.ecr.us-east-1.amazonaws.com/alpine/curl:8.9.1@sha256:e13f4217ebcbb8dbbfad0ae422bca76a3b037b0030cb7123138b4cb1ca49fbb5
        imagePullPolicy: Always
        env:
        - name: MARKER_PREFIX
          value: {{ .Values.fixture.markerPrefix | quote }}
        command:
        - sh
        - -c
        - |
          set -eu
          : "${MARKER_PREFIX:?missing}"
          n=0
          while true; do
            n=$((n+1))
            curl -sS --max-time 5 \
              "http://resilience-server/test/${MARKER_PREFIX}_seq${n}" \
              -o /dev/null -w "${MARKER_PREFIX}_seq${n} HTTP %{http_code}\n" \
              || echo "send failed"
            sleep 0.2
          done
      nodeSelector:
        kubernetes.io/os: linux

{{- end }}
