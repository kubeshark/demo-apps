{{- if include "demo-apps.need" (merge (dict "component" "ledger") .) }}
{{- $ctx := dict "root" . "name" "ledger" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ledger
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: ledger
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            - name: MSSQL_ADDR
              value: {{ .Release.Name }}-mssql:1433
            - name: MSSQL_USER
              value: sa
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-apps.secretName" (dict "root" . "name" "mssql" "server" .Values.servers.mssql) }}
                  key: sa-password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.services.ledger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ledger
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
