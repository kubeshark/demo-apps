{{- if include "demo-apps.need" (merge (dict "component" "coredns") .) }}
{{- $ctx := dict "root" . "name" "coredns" }}
{{- $s := .Values.servers.coredns }}
{{- $zone := $s.zone }}
{{- /* The zone's records come from the netprobe markers, the same file the service resolves from. */}}
{{- $hosts := list }}
{{- $hosts6 := list }}
{{- $srvs := list }}
{{- $txts := list }}
{{- range $line := .Files.Get "files/markers/netprobe.tsv" | required "files/markers/netprobe.tsv is missing: run make markers" | splitList "\n" }}
{{- $cols := splitList "\t" $line }}
{{- if eq (len $cols) 3 }}
{{- $v := index $cols 1 }}
{{- $field := index (splitList "-" $v) 2 }}
{{- if eq $field "HOST" }}{{ $hosts = append $hosts $v }}
{{- else if eq $field "HOST6" }}{{ $hosts6 = append $hosts6 $v }}
{{- else if eq $field "SRV" }}{{ $srvs = append $srvs $v }}
{{- else if eq $field "TXT" }}{{ $txts = append $txts $v }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-coredns
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
data:
  Corefile: |
    {{ $zone }}:53 {
        file /etc/coredns/zone.db
        log
        errors
        health :8080
        ready :8181
    }
  zone.db: |
    $ORIGIN {{ $zone }}.
    $TTL 60
    @ IN SOA ns.{{ $zone }}. hostmaster.{{ $zone }}. 1 7200 3600 1209600 60
    @ IN NS ns.{{ $zone }}.
    ns IN A 10.99.0.1
    {{- range $i, $h := $hosts }}
    {{ $h }} IN A 10.99.0.{{ add 10 $i }}
    {{- end }}
    {{- range $i, $h := $hosts6 }}
    {{ $h }} IN AAAA fd00:4b53:4b45:4550::{{ add 1 $i }}
    {{- end }}
    {{- range $srv := $srvs }}
    _{{ $srv }}._tcp IN SRV 0 5 8080 {{ first $hosts }}
    {{- end }}
    {{- range $t := $txts }}
    {{ $t }} IN TXT "{{ $t }} zone={{ $zone }}"
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-coredns
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: coredns
          image: {{ include "demo-apps.mirrorImage" (dict "root" . "image" $s.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["-conf", "/etc/coredns/Corefile"]
          # The binary carries cap_net_bind_service as a file capability;
          # exec refuses it unless the bounding set holds the capability.
          {{- $sc := include "demo-apps.securityContext" . | fromYaml }}
          {{- $_ := set $sc "capabilities" (dict "drop" (list "ALL") "add" (list "NET_BIND_SERVICE")) }}
          securityContext:
            {{- toYaml $sc | nindent 12 }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: ready
              containerPort: 8181
          readinessProbe:
            httpGet: {path: /ready, port: ready}
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-coredns
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-coredns
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
# Headless twin: resolves to the pod itself, which answers ICMP echo where
# a cluster IP does not.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-coredns-pods
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
{{- end }}
