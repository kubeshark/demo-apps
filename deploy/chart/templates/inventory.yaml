{{- if include "demo-apps.need" (merge (dict "component" "inventory") .) }}
{{- $ctx := dict "root" . "name" "inventory" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inventory
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: inventory
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-apps.secretName" (dict "root" . "name" "mongodb" "server" .Values.servers.mongodb) }}
                  key: password
            - name: MONGODB_URI
              value: mongodb://{{ .Values.servers.mongodb.rootUser }}:$(MONGODB_PASSWORD)@{{ .Release.Name }}-mongodb:27017/?authSource=admin
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc: {port: 9090}
          resources:
            {{- toYaml .Values.services.inventory.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-inventory
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
{{- end }}
