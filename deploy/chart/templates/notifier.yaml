{{- if include "demo-apps.need" (merge (dict "component" "notifier") .) }}
{{- $ctx := dict "root" . "name" "notifier" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notifier
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: notifier
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Release.Name }}-kafka:9092
            - name: KAFKA_USER
              value: {{ .Values.servers.kafka.user }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-apps.secretName" (dict "root" . "name" "kafka" "server" .Values.servers.kafka) }}
                  key: password
            - name: KAFKA_PIN_VERSIONS
              value: {{ .Values.flows.orders.kafkaPinned | quote }}
            - name: RABBITMQ_ADDR
              value: {{ .Release.Name }}-rabbitmq:5672
            - name: RABBITMQ_USER
              value: {{ .Values.servers.rabbitmq.user }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demo-apps.secretName" (dict "root" . "name" "rabbitmq" "server" .Values.servers.rabbitmq) }}
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.services.notifier.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-notifier
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
