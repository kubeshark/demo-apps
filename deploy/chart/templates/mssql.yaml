{{- if include "demo-apps.need" (merge (dict "component" "mssql") .) }}
{{- $ctx := dict "root" . "name" "mssql" }}
{{- $s := .Values.servers.mssql }}
{{- $secret := include "demo-apps.secretName" (dict "root" . "name" "mssql" "server" $s) }}
{{- if not $s.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mssql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
stringData:
  sa-password: {{ $s.saPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mssql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
data:
  # The server phones home with usage data by default; that is traffic a
  # presenter did not ask for.
  mssql.conf: |
    [telemetry]
    customerfeedback = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mssql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      # The image runs as the mssql user and group, uid and gid 10001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mssql
          image: {{ include "demo-apps.mirrorImage" (dict "root" . "image" $s.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # sqlservr carries cap_net_bind_service as a file capability; exec
          # refuses it unless the bounding set holds the capability.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: sa-password}
            # Keeps the server's own memory target under the container limit.
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
          ports:
            - name: mssql
              containerPort: 1433
          readinessProbe:
            tcpSocket: {port: mssql}
            initialDelaySeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: config
              mountPath: /var/opt/mssql/mssql.conf
              subPath: mssql.conf
              readOnly: true
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}-mssql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mssql
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: mssql
      port: 1433
      targetPort: mssql
{{- end }}
