---
# Same envoy bootstrap config used in envoy-tls.yaml. The point of this case
# is not to test a different config - it's to test that Kubeshark's BoringSSL
# tracer hooks work against the Envoy BUILD shipped by Istio's proxyv2 image
# (statically-linked BoringSSL, different binary hash from envoyproxy/envoy).
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: istio-gateway-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: https_listener
          address:
            socket_address: { address: 0.0.0.0, port_value: 10443 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_https
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: echo_backend }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/envoy/certs/tls.crt }
                        private_key:       { filename: /etc/envoy/certs/tls.key }
      clusters:
        - name: echo_backend
          type: STRICT_DNS
          load_assignment:
            cluster_name: echo_backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: echo-server, port_value: 8080 }
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
  labels: { app: echo-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo-server }
  template:
    metadata:
      labels: { app: echo-server }
    spec:
      containers:
      - name: echo-server
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        image: docker.io/hashicorp/http-echo:latest@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
        args: ["-text=hello from echo-server behind istio-gateway envoy", "-listen=:8080"]
        ports:
        - containerPort: 8080
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: echo-server
---
# istio-gateway = istio/proxyv2 image run as a vanilla envoy with a static
# bootstrap config. Bypasses pilot-agent (which would otherwise try to fetch
# config from istiod over xDS). The envoy binary at /usr/local/bin/envoy
# inside proxyv2 is Istio's BoringSSL build - different binary hash from
# envoyproxy/envoy, registered separately in registry-go-tls's offsets bundle.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: istio-gateway
  labels: { app: istio-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: istio-gateway }
  template:
    metadata:
      labels: { app: istio-gateway }
    spec:
      containers:
      - name: envoy
        image: docker.io/istio/proxyv2:1.25.1@sha256:640733abb924663df83761e2ec95a2bddca797daf1ca37672ec0b045969cdeb1
        command: ["/usr/local/bin/envoy"]
        args: ["-c", "/etc/envoy/envoy.yaml"]
        ports:
        - { name: https, containerPort: 10443 }
        - { name: admin, containerPort: 9901 }
        volumeMounts:
        - { name: config, mountPath: /etc/envoy,       readOnly: true }
        - { name: certs,  mountPath: /etc/envoy/certs, readOnly: true }
        readinessProbe:
          httpGet: { path: /ready, port: 9901 }
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: istio-gateway-config
      - name: certs
        secret:
          secretName: istio-gateway-tls
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: istio-gateway
spec:
  ports:
  - { name: https, port: 443, targetPort: 10443 }
  selector:
    app: istio-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: istio-gateway-traffic-generator
  labels: { app: istio-gateway-traffic-generator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: istio-gateway-traffic-generator }
  template:
    metadata:
      labels: { app: istio-gateway-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
        env:
        - { name: MARKER_PREFIX,    value: {{ .Values.tlsFixture.markerPrefix | quote }} }
        - { name: EXPECTED_MARKERS, value: {{ .Values.tlsFixture.markerCount | quote }} }
        command:
        - sh
        - -c
        - |
          set -eu
          : "${MARKER_PREFIX:?missing}"
          : "${EXPECTED_MARKERS:?missing}"
          while true; do
            for i in $(seq 1 "${EXPECTED_MARKERS}"); do
              curl -sk --max-time 5 \
                "https://istio-gateway/test/${MARKER_PREFIX}_seq${i}" \
                -o /dev/null -w "${MARKER_PREFIX}_seq${i} HTTP %{http_code}\n" \
                || echo "send failed"
            done
            sleep {{ include "demo-apps.tlsFixtureSeconds" . }}
          done
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
