---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: traefik-config
data:
  traefik.yaml: |
    ping:
      entryPoint: admin
    entryPoints:
      https:
        address: ":8443"
      admin:
        address: ":9000"
    providers:
      file:
        filename: /etc/traefik/dynamic.yaml
  dynamic.yaml: |
    tls:
      certificates:
        - certFile: /etc/traefik/certs/tls.crt
          keyFile: /etc/traefik/certs/tls.key
    http:
      routers:
        echo:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - https
          tls: {}
          service: echo-backend
      services:
        echo-backend:
          loadBalancer:
            servers:
              - url: "http://echo-server:8080"
---
# Backend the traefik router proxies decrypted requests to.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
  labels: { app: echo-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo-server }
  template:
    metadata:
      labels: { app: echo-server }
    spec:
      containers:
      - name: echo-server
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        image: docker.io/hashicorp/http-echo:latest@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
        args:
          - "-text=hello from echo-server"
          - "-listen=:8080"
        ports:
        - containerPort: 8080
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: echo-server
---
# Traefik - the stripped-Go binary under test. v3.6.13 is one of the
# entries in registry-go-tls's offsets-bundle.json (go-stripped strategy).
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: traefik
  labels: { app: traefik }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      containers:
      - name: traefik
        image: docker.io/traefik:v3.6.13@sha256:34d5089d0b414945342848518b383f11f5b3a645504ed87b77ffeb9d683d0e48
        args:
          - "--configFile=/etc/traefik/traefik.yaml"
        ports:
        - { name: https, containerPort: 8443 }
        - { name: admin, containerPort: 9000 }
        volumeMounts:
        - { name: config, mountPath: /etc/traefik, readOnly: true }
        - { name: certs, mountPath: /etc/traefik/certs, readOnly: true }
        readinessProbe:
          httpGet: { path: /ping, port: 9000 }
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: traefik-config
      - name: certs
        secret:
          secretName: traefik-tls
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: traefik
spec:
  ports:
  - { name: https, port: 443, targetPort: 8443 }
  selector:
    app: traefik
---
# Traffic generator - keeps sending HTTPS requests on the configured batch cadence so
# the verifier always has fresh entries to scan, regardless of when it connects.
# Client = curl (OpenSSL). Doesn't matter what TLS lib the client uses; the
# tracer's eBPF hooks live on traefik's Go crypto/tls side, where decryption
# happens. The marker is embedded in the URL path so it surfaces in the HTTP
# request_url of every dissected entry.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: traefik-traffic-generator
  labels: { app: traefik-traffic-generator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik-traffic-generator }
  template:
    metadata:
      labels: { app: traefik-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
        env:
        - name: MARKER_PREFIX
          value: {{ .Values.tlsFixture.markerPrefix | quote }}
        - name: EXPECTED_MARKERS
          value: {{ .Values.tlsFixture.markerCount | quote }}
        command:
        - sh
        - -c
        - |
          set -eu
          : "${MARKER_PREFIX:?missing}"
          : "${EXPECTED_MARKERS:?missing}"
          echo "Looping: ${MARKER_PREFIX}_seq1..${EXPECTED_MARKERS}"
          while true; do
            for i in $(seq 1 "${EXPECTED_MARKERS}"); do
              curl -sk --max-time 5 \
                "https://traefik/test/${MARKER_PREFIX}_seq${i}" \
                -o /dev/null -w "${MARKER_PREFIX}_seq${i} HTTP %{http_code}\n" \
                || echo "send failed"
            done
            sleep {{ include "demo-apps.tlsFixtureSeconds" . }}
          done
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
