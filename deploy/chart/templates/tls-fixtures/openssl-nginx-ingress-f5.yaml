# Source: nginx-ingress/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress-controller
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: nginx-ingress-2.5.2
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/instance: nginx-ingress
    app.kubernetes.io/version: "5.4.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-ingress
      app.kubernetes.io/instance: nginx-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-ingress
        app.kubernetes.io/instance: nginx-ingress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/scheme: "http"
    spec:      
      volumes: []
      serviceAccountName: nginx-ingress
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
      - image: nginx/nginx-ingress:5.4.2@sha256:e29d0aece4a8b7b4c3efd52ff18bdbfdf087d8cb699af932bf4bc0b4208a85c2
        name: nginx-ingress
        imagePullPolicy: "IfNotPresent"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: prometheus
          containerPort: 9113
        - name: readiness-port
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /nginx-ready
            port: readiness-port
          periodSeconds: 1
          initialDelaySeconds: 0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsUser: 101 #nginx
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE        
        volumeMounts: []
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        args:
          
          - -nginx-plus=false
          - -nginx-reload-timeout=60000
          - -enable-app-protect=false
          - -enable-app-protect-dos=false
          - -nginx-configmaps=$(POD_NAMESPACE)/nginx-ingress
          - -ingress-class={{ $clusterName }}
          - -watch-namespace={{ .Release.Namespace }}
          - -health-status=false
          - -health-status-uri=/nginx-health
          - -nginx-debug=false
          - -log-level=info
          - -log-format=glog
          - -enable-config-safety=false
          - -nginx-status=true
          - -nginx-status-port=8080
          - -nginx-status-allow-cidrs=127.0.0.1
          - -report-ingress-status
          - -enable-leader-election=true
          - -leader-election-lock-name=nginx-ingress-leader-election
          - -enable-prometheus-metrics=true
          - -prometheus-metrics-listen-port=9113
          - -prometheus-tls-secret=
          - -enable-service-insight=false
          - -service-insight-listen-port=9114
          - -service-insight-tls-secret=
          - -enable-custom-resources=false
          - -enable-snippets=false
          - -disable-ipv6=false
          - -ready-status=true
          - -ready-status-port=8081
          - -enable-latency-metrics=false
          - -ssl-dynamic-reload=true
          - -enable-telemetry-reporting=true
          - -weight-changes-dynamic-reload=false
---
# Source: nginx-ingress/templates/controller-ingress-class.yaml
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ $clusterName }}
  labels:
    helm.sh/chart: nginx-ingress-2.5.2
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/instance: nginx-ingress
    app.kubernetes.io/version: "5.4.2"
    app.kubernetes.io/managed-by: Helm
spec:
  controller: nginx.org/ingress-controller
---
# Source: nginx-ingress/templates/controller-configmap.yaml
---
---
# Source: nginx-ingress/templates/controller-lease.yaml
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: nginx-ingress-leader-election
  namespace: {{ .Release.Namespace | quote }}
  labels:
    helm.sh/chart: nginx-ingress-2.5.2
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/instance: nginx-ingress
    app.kubernetes.io/version: "5.4.2"
    app.kubernetes.io/managed-by: Helm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
  labels: { app: echo-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo-server }
  template:
    metadata:
      labels: { app: echo-server }
    spec:
      containers:
      - name: echo-server
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 60
        image: docker.io/hashicorp/http-echo:latest@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
        args: ["-text=hello from echo-server behind nginx-ingress-f5", "-listen=:8080"]
        ports:
        - containerPort: 8080
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo-server
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: echo-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: echo
spec:
  ingressClassName: {{ $clusterName }}
  tls:
    - hosts:
        - echo-f5.demo.local
      secretName: nginx-ingress-f5-tls
  rules:
    - host: echo-f5.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-server
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: nginx-ingress-f5-traffic-generator
  labels: { app: nginx-ingress-f5-traffic-generator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-ingress-f5-traffic-generator }
  template:
    metadata:
      labels: { app: nginx-ingress-f5-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
        env:
        - { name: MARKER_PREFIX,    value: {{ .Values.tlsFixture.markerPrefix | quote }} }
        - { name: EXPECTED_MARKERS, value: {{ .Values.tlsFixture.markerCount | quote }} }
        command:
        - sh
        - -c
        - |
          set -eu
          : "${MARKER_PREFIX:?missing}"
          : "${EXPECTED_MARKERS:?missing}"
          while true; do
            for i in $(seq 1 "${EXPECTED_MARKERS}"); do
              # F5 NGINX sends a TLS alert ("unrecognized_name") if SNI
              # doesn't match a configured server. --connect-to keeps the
              # SNI (echo-f5.demo.local) aligned with the Host header while
              # the TCP connection still goes to the controller svc.
              curl -sk --max-time 5 \
                --connect-to echo-f5.demo.local:443:nginx-ingress-controller:443 \
                "https://echo-f5.demo.local/test/${MARKER_PREFIX}_seq${i}" \
                -o /dev/null -w "${MARKER_PREFIX}_seq${i} HTTP %{http_code}\n" \
                || echo "send failed"
            done
            sleep {{ include "demo-apps.tlsFixtureSeconds" . }}
          done
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
