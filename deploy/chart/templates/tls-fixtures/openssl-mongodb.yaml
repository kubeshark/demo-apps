apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mongo
  labels: { app: mongo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
      - name: mongo
        readinessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 2
          failureThreshold: 60
        image: docker.io/mongo:8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
        args:
          - "--bind_ip_all"
          - "--tlsMode=requireTLS"
          - "--tlsCertificateKeyFile=/etc/mongo-tls/server.pem"
          # Self-signed CA = the server cert itself. Mongo 8 refuses to start
          # otherwise: "TLS without specifying a chain of trust is no longer supported".
          - "--tlsCAFile=/etc/mongo-tls/server.pem"
          - "--tlsAllowConnectionsWithoutCertificates"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: tls
          mountPath: /etc/mongo-tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: mongo-tls
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mongo
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongo
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mongo-traffic-script
data:
  send.sh: |
    #!/bin/sh
    set -e
    : "${MARKER_PREFIX:?missing}"
    : "${EXPECTED_MARKERS:?missing}"

    # Build JS that inserts EXPECTED_MARKERS docs, each carrying a unique marker.
    JS=""
    i=1
    while [ "$i" -le "$EXPECTED_MARKERS" ]; do
      JS="${JS} db.tls_test.insertOne({marker:'${MARKER_PREFIX}_seq${i}', i:${i}});"
      i=$((i + 1))
    done
    JS="${JS} db.tls_test.deleteMany({});"

    echo "Sending markers: ${MARKER_PREFIX}_seq1..${EXPECTED_MARKERS} (loop)"
    while true; do
      mongosh \
        --tls \
        --tlsAllowInvalidCertificates \
        --tlsAllowInvalidHostnames \
        "mongodb://mongo:27017/testdb" \
        --quiet \
        --eval "$JS" || echo "send failed, retrying"
      sleep {{ include "demo-apps.tlsFixtureSeconds" . }}
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: mongo-traffic-generator
  labels: { app: mongo-traffic-generator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo-traffic-generator }
  template:
    metadata:
      labels: { app: mongo-traffic-generator }
    spec:
      containers:
      - name: client
        image: docker.io/mongo:8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
        command: ["/bin/sh", "/scripts/send.sh"]
        env:
        - name: MARKER_PREFIX
          value: {{ .Values.tlsFixture.markerPrefix | quote }}
        - name: EXPECTED_MARKERS
          value: {{ .Values.tlsFixture.markerCount | quote }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mongo-traffic-script
          defaultMode: 0755
      nodeSelector:
        kubernetes.io/os: linux
{{- end }}
