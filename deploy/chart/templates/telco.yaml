{{- if include "demo-apps.need" (merge (dict "component" "telco") .) }}
{{- $ctx := dict "root" . "name" "telco" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-telco
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-apps.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: telco
          image: {{ include "demo-apps.image" $ctx }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "demo-apps.securityContext" . | nindent 12 }}
          env:
            - name: DIAMETER_ADDR
              value: {{ .Release.Name }}-telco-server:3868
            - name: SCTP_ECHO_ADDR
              value: {{ .Release.Name }}-telco-server:3869
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.services.telco.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-telco
  labels:
    {{- include "demo-apps.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
