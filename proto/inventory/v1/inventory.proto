syntax = "proto3";

package inventory.v1;

option go_package = "github.com/kubeshark/demo-apps/gen/inventory/v1;inventoryv1";

service InventoryService {
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

message GetStockRequest {
  string sku = 1;
  // Server-side delay before answering; the slow path of the flow.
  uint32 delay_ms = 2;
}

message GetStockResponse {
  string sku = 1;
  string name = 2;
  int64 available = 3;
  string warehouse = 4;
}

message ReserveRequest {
  string sku = 1;
  int64 quantity = 2;
  string order_id = 3;
}

message ReserveResponse {
  string reservation_id = 1;
  int64 remaining = 2;
}
